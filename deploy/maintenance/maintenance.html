<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Сайт временно недоступен — TIR-Lugansk</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon_io/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Oswald", sans-serif;
            color: #282828;
            background: #f5f8fa;
            padding: 24px;
        }
        .maintenance {
            max-width: 560px;
            width: 100%;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(169, 175, 180, 0.15);
        }
        .maintenance__logo {
            margin-bottom: 28px;
        }
        .maintenance__logo img {
            max-width: 220px;
            height: auto;
        }
        .maintenance__title {
            margin: 0 0 16px;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
        }
        .maintenance__text {
            margin: 0 0 28px;
            font-size: 17px;
            line-height: 1.5;
            color: #555;
        }
        .maintenance__contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .maintenance__link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #282828;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
        }
        .maintenance__link:hover {
            color: #FF2E3B;
        }
        .maintenance__btn {
            display: inline-block;
            padding: 14px 28px;
            background: #FF2E3B;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .maintenance__btn:hover {
            opacity: 0.9;
        }
        .maintenance__note {
            margin: 24px 0 0;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="maintenance">
        <div class="maintenance__logo">
            <img src="/static/img/logo.png" alt="TIR-Lugansk" width="220" height="auto">
        </div>
        <h1 class="maintenance__title">Сайт временно недоступен</h1>
        <p class="maintenance__text">
            Проводятся технические работы или наблюдаются временные неполадки.
            Пожалуйста, попробуйте обновить страницу через несколько минут.
        </p>
        <div class="maintenance__contacts">
            <a class="maintenance__link" href="tel:+79590029073">+7 (959) 002-90-73</a>
            <a class="maintenance__link" href="mailto:sales@tir-lugansk.ru">sales@tir-lugansk.ru</a>
        </div>
        <a class="maintenance__btn" href="/">Обновить страницу</a>
        <p class="maintenance__note">© TIR-Lugansk — запчасти для грузовых автомобилей</p>
    </div>
</body>
</html>
